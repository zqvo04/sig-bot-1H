# WRF-4 보정 워크플로우 — 주 1회 (월요일 00:30 UTC)
#
# JSONL 경로에서 triple-barrier+exret 라벨 파생 → 셀(setup×regime×btc_macro)
# 신뢰게이트 → 자격 셀만 로지스틱+isotonic 학습 → calibration_table.json 커밋.
# 라이브는 이 테이블만 읽는다. 자격 미달 셀은 prior 유지(드리프트 리포트 동봉).
name: WRF Calibrate

on:
  schedule:
    - cron: '30 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Run calibration
        run: |
          python analysis/calibrate.py | tee logs_calib.txt
          echo "### WRF 보정 리포트" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat logs_calib.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Commit calibration table
        if: always()
        run: |
          if [ -z "$(git status --porcelain data/calibration_table.json 2>/dev/null)" ]; then
            echo "변경 없음 — 커밋 생략"; exit 0
          fi
          git config user.name  "wrf-bot"
          git config user.email "actions@users.noreply.github.com"
          BRANCH="${GITHUB_REF_NAME}"
          git add data/calibration_table.json
          git commit -m "data(calib): calibration_table 주간 갱신 [skip ci]"
          for i in 1 2 3 4 5; do
            git fetch origin "$BRANCH" || true
            git rebase "origin/$BRANCH" || git rebase --abort || true
            if git push origin "HEAD:$BRANCH"; then echo "✅ push (시도 $i)"; exit 0; fi
            sleep $((2 ** i))
          done
          echo "❌ push 최종 실패(비치명적)"; exit 0
