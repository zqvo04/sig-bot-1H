# WRF-4 신호 워크플로우 — 매시 :05 (페이퍼 전용)
#
# 1H 캔들 마감(:00) → :05 실행 → 수집·측정·엔진(L0~L4)·발사(페이퍼)·스냅샷 적재·알림.
# 심볼별 병렬, JSONL은 심볼별 파일이라 충돌 없음(push 경합은 fetch+rebase 백오프 재시도).
name: WRF Signal

on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  signal:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      matrix:
        symbol: ["BTC/USDT", "ETH/USDT", "HYPE/USDT"]
      fail-fast: false
      max-parallel: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Run WRF signal — ${{ matrix.symbol }}
        env:
          OKX_API_KEY:        ${{ secrets.OKX_API_KEY }}
          OKX_API_SECRET:     ${{ secrets.OKX_API_SECRET }}
          OKX_PASSPHRASE:     ${{ secrets.OKX_PASSPHRASE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          SINGLE_SYMBOL:      ${{ matrix.symbol }}
          # 발사 시 텔레그램 알림 ON(기본 true). 저장소 Settings→Actions→Variables에
          # ALERT_ENABLED=false 를 두면 코드 변경 없이 즉시 다시 OFF(기록만) 가능.
          ALERT_ENABLED:      ${{ vars.ALERT_ENABLED || 'true' }}
          NOTION_TOKEN:           ${{ secrets.NOTION_TOKEN }}
          NOTION_PARENT_PAGE_ID:  ${{ secrets.NOTION_PARENT_PAGE_ID }}
          NOTION_SIGNALS_DB_ID:   ${{ secrets.NOTION_SIGNALS_DB_ID }}
          NOTION_SNAPSHOTS_DB_ID: ${{ secrets.NOTION_SNAPSHOTS_DB_ID }}
        run: python src/main.py --mode signal
      - name: Commit research data
        if: always()
        run: |
          if [ -z "$(git status --porcelain data/research 2>/dev/null)" ]; then
            echo "변경 없음 — 커밋 생략"; exit 0
          fi
          git config user.name  "wrf-bot"
          git config user.email "actions@users.noreply.github.com"
          BRANCH="${GITHUB_REF_NAME}"
          git add data/research
          git commit -m "data(research): ${SINGLE_SYMBOL} v3 스냅샷 적재 [skip ci]"
          for i in 1 2 3 4 5; do
            git fetch origin "$BRANCH" || true
            git rebase "origin/$BRANCH" || git rebase --abort || true
            if git push origin "HEAD:$BRANCH"; then echo "✅ push (시도 $i)"; exit 0; fi
            echo "⚠️ push 실패 ${i}회 — 백오프"; sleep $((2 ** i))
          done
          echo "❌ push 최종 실패(비치명적)"; exit 0
        env:
          SINGLE_SYMBOL: ${{ matrix.symbol }}
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.symbol }}-${{ github.run_id }}
          path: logs/
          retention-days: 3
