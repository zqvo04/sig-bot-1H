# WRF-4 채점 워크플로우 — 매 :*/15 (성숙 경로 채움 + 신호 판정)
#
# 성숙한 스냅샷의 72h 경로를 증분 캡처(JSONL)하고, OPEN 페이퍼 신호를
# triple-barrier로 WIN/LOSS/TIMEOUT 판정(Notion). 스냅샷 파생라벨도 백필.
name: WRF Scoring

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      matrix:
        symbol: ["BTC/USDT", "ETH/USDT", "HYPE/USDT"]
      fail-fast: false
      max-parallel: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Run WRF scoring — ${{ matrix.symbol }}
        env:
          OKX_API_KEY:        ${{ secrets.OKX_API_KEY }}
          OKX_API_SECRET:     ${{ secrets.OKX_API_SECRET }}
          OKX_PASSPHRASE:     ${{ secrets.OKX_PASSPHRASE }}
          SINGLE_SYMBOL:      ${{ matrix.symbol }}
          NOTION_TOKEN:           ${{ secrets.NOTION_TOKEN }}
          NOTION_PARENT_PAGE_ID:  ${{ secrets.NOTION_PARENT_PAGE_ID }}
          NOTION_SIGNALS_DB_ID:   ${{ secrets.NOTION_SIGNALS_DB_ID }}
          NOTION_SNAPSHOTS_DB_ID: ${{ secrets.NOTION_SNAPSHOTS_DB_ID }}
        run: python src/main.py --mode score
      - name: Commit path updates
        if: always()
        run: |
          if [ -z "$(git status --porcelain data/research 2>/dev/null)" ]; then
            echo "변경 없음 — 커밋 생략"; exit 0
          fi
          git config user.name  "wrf-bot"
          git config user.email "actions@users.noreply.github.com"
          BRANCH="${GITHUB_REF_NAME}"
          git add data/research
          git commit -m "data(research): ${SINGLE_SYMBOL} 경로 채점 갱신 [skip ci]"
          for i in 1 2 3 4 5; do
            git fetch origin "$BRANCH" || true
            git rebase "origin/$BRANCH" || git rebase --abort || true
            if git push origin "HEAD:$BRANCH"; then echo "✅ push (시도 $i)"; exit 0; fi
            sleep $((2 ** i))
          done
          echo "❌ push 최종 실패(비치명적)"; exit 0
        env:
          SINGLE_SYMBOL: ${{ matrix.symbol }}
